# ml/configs/mlp_d3.yaml
# 실제 학습용 (로컬/GPU). geometry는 d=3/r=3 고정 — 서빙(/decode)과 반드시 일치.
code:
  name: "surface_code"
  distance: 3
  rounds: 3

noise:
  p_gate: [0.003, 0.005, 0.007, 0.009, 0.011]   # 여러 값 섞어 일반화
  p_meas: 0.005
  p_corr: 0.0

training:
  data_mode: "online"
  train_steps: 40000
  val_steps: 4000
  chunk_size: 10000
  epochs: 30
  batch_size: 1024
  seed: 42
  num_workers: 0      # WSL2에서 online 시뮬레이터 + 멀티프로세싱 DataLoader가 stall → 메인 프로세스 생성
  pin_memory: false   # CPU 전용 (accelerator 없음)
  optimizer:
    name: "Adam"
    kwargs:
      lr: 0.001
  criterion:
    name: "bce_with_logits"
    kwargs: {}
  early_stopping:
    patience: 10
  output_dir: "./results/mlp_d3"

model:
  name: "mlp"
  kwargs:
    hidden_dim: 512   # input_dim/num_observables/code_distance는 factory가 주입

decoder:
  name: "neural_decoder"
  weight_path: ""
  model_kwargs: {}

simulation:
  backend: "stim"

mlflow:
  enable: true
  experiment_name: "surface_code_d3_r3"   # geometry=(distance,rounds) 단위로 분리
  tracking_uri: "sqlite:///mlruns.db"   # placeholder — 배포 시 MLFLOW_TRACKING_URI env로 덮어씀
  register_model: true
  registered_model_name: "mlp_d3_r3"
  register_alias: "challenger"          # 새 학습은 항상 challenger
  tags:
    project: "qec_dashboard"
