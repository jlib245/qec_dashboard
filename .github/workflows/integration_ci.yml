# .github/workflows/integration.yml
name: Integration CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:  # Actions 탭에서 수동 실행 가능

jobs:
  integration-tests:
    name: Real tests with qec-sim
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU-only torch
        # 풀버전 torch는 ~2GB. CPU 휠은 ~150MB로 훨씬 가벼움
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install qec-sim (skip transitive deps)
        # intel-extension, pandas, jupyter 등 import 체인에 없는 무거운 deps 회피
        run: pip install --no-deps git+https://github.com/jlib245/qec.git@v0.1.0

      - name: Install qec-sim runtime essentials
        run: pip install stim pymatching numpy pyyaml

      - name: Install dashboard deps
        run: pip install fastapi uvicorn pytest hypothesis httpx requests

      - name: Verify qec-sim importable
        run: python -c "from qec_sim.decoders.mwpm import MWPMDecoder; print('qec-sim OK')"

      - name: Run all tests
        run: pytest tests/ -v
