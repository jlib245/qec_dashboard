# ml/configs/mlp_d3_smoke.yaml
# CI 파이프라인 동작 검증용 (모델 품질 X). 학습→로깅→registry 등록까지 빠르게 통과시킨다.
code:
  name: "surface_code"
  distance: 3
  rounds: 3

noise:
  p_gate: [0.005, 0.01]
  p_meas: 0.005
  p_corr: 0.0

training:
  data_mode: "online"
  train_steps: 500
  val_steps: 100
  chunk_size: 500
  epochs: 1
  batch_size: 256
  seed: 42
  optimizer:
    name: "Adam"
    kwargs:
      lr: 0.001
  criterion:
    name: "bce_with_logits"
    kwargs: {}
  early_stopping:
    patience: 3
  output_dir: "./results/mlp_d3_smoke"

model:
  name: "mlp"
  kwargs:
    hidden_dim: 64

decoder:
  name: "neural_decoder"
  weight_path: ""
  model_kwargs: {}

simulation:
  backend: "stim"

mlflow:
  enable: true
  experiment_name: "surface_code_d3"   # 실제와 동일 experiment, kind:smoke 태그로 구분
  tracking_uri: "sqlite:///mlruns.db"
  register_model: true
  registered_model_name: "mlp_d3_smoke"
  register_alias: "challenger"
  tags:
    project: "qec_dashboard"
    kind: "smoke"
