# .github/workflows/train.yml
# 실제 학습 → registry 등록 → test_ler이 더 좋으면 champion 자동 교체.
# 실행 시 로컬 MLflow 서버 + ngrok이 켜져 있고, Secrets에 MLFLOW_TRACKING_URI(ngrok URL)가 있어야 함.
name: Train & Auto-Promote

on:
  push:
    branches: [ main ]
    paths:
      - 'ml/**'
      - 'requirements.txt'
      - '.github/workflows/train.yml'
  workflow_dispatch:
    inputs:
      config:
        description: "학습 config 경로"
        default: "ml/configs/mlp_d3.yaml"

jobs:
  train-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU-only torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install qec-sim (@v0.1.0) + deps
        run: |
          pip install --no-deps git+https://github.com/jlib245/qec.git@v0.1.0
          pip install -r requirements.txt

      # 학습 → test_ler 로깅 → registry 등록 → 더 좋으면 champion 자동 교체 (ml.train 내부)
      - name: Train, register & auto-promote
        run: python -m ml.train --config "${{ github.event.inputs.config || 'ml/configs/mlp_d3.yaml' }}"
